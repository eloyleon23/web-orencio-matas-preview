name: Sincronizar y publicar previsualización

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout de feature/web-reestructuracion (repo publico origen, sin credenciales)
        uses: actions/checkout@v4
        with:
          repository: eloyleon23/web-orencio-matas
          ref: feature/web-reestructuracion
          path: sitio

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
